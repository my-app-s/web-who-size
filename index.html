<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>What size</title>
        <link rel="stylesheet" href="output.css">
    </head>
    <body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col justify-between font-sans antialiased select-none">
        <main class="mx-auto max-w-xl w-full p-6 flex flex-col gap-6 my-auto">
            <div class="flex flex-col gap-2 select-text">
                <h1 class="text-2xl font-bold tracking-tight">What size element for web</h1>
                <p class="text-neutral-400 text-sm">Please enter width and height (10 to 1000px):</p>
            </div>

            <div class="cursor-grab flex flex-col sm:flex-row gap-4 bg-neutral-900 border border-neutral-800 p-4 rounded-xl">
                <label class="flex-1 flex items-center justify-between text-sm font-medium">
                    <span>W:</span>
                    <input id="range-width" type="range" min="10" max="1000" value="500" class="w-3/4 accent-neutral-200 cursor-pointer">
                </label>
                <label class="flex-1 flex items-center justify-between text-sm font-medium">
                    <span>H:</span>
                    <input id="range-height" type="range" min="10" max="1000" value="100" class="w-3/4 accent-neutral-200 cursor-pointer">
                </label>
            </div>

            <div class="flex items-center gap-2">
                <input id="text-width" type="text" placeholder="Width" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-neutral-500">
                <span class="text-neutral-500 font-semibold">×</span>
                <input id="text-height" type="text" placeholder="Height" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-neutral-500">
                <button id="update-button" class="bg-neutral-100 text-neutral-900 font-medium px-5 py-2 rounded-lg text-sm hover:bg-neutral-200 transition-colors cursor-pointer">Select</button>
            </div>

            <div>
                <input type="file" id="background-upload" class="block w-full text-sm text-neutral-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-neutral-800 file:text-neutral-200 hover:file:bg-neutral-700 cursor-pointer select-text">
            </div>

            <div id="div-size" class="div-for-size relative bg-neutral-900 border border-neutral-800 rounded-xl p-4 flex flex-col items-center justify-center gap-1 min-h-[10px] overflow-visible">
                <div id="label-width" class="text-xs text-white transition-all duration-75">Width: 500px</div>
                <div id="label-height" class="text-xs text-white transition-all duration-75">Height: 100px</div>
            </div>
        </main>

        <footer class="footer-info text-center text-xs text-neutral-500 py-6 border-t border-neutral-900 flex flex-col gap-1 select-text">
            <div>© Copyright 2025 my-app-s(M.R.E)</div>
            <div>
                <a href="https://github.com/my-app-s/web-who-size" class="text-neutral-400 hover:underline">web-who-size</a>
            </div>
            <div>Content rights and property belong to their respective authors.</div>
        </footer>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const div = document.querySelector(".div-for-size");
                const widthSlider = document.querySelector("#range-width");
                const heightSlider = document.querySelector("#range-height");
                const textWidth = document.querySelector("#text-width");
                const textHeight = document.querySelector("#text-height");
                const updateButton = document.querySelector("#update-button");

                function applySize(w, h) {
                    w = Math.max(10, Math.min(1000, w));
                    h = Math.max(10, Math.min(1000, h));

                    const widthValue = w + "px";
                    const heightValue = h + "px";

                    div.style.width = widthValue;
                    div.style.height = heightValue;

                    const widthDisplay = document.querySelector("#label-width");
                    const heightDisplay = document.querySelector("#label-height");

                    if (w < 126 || h < 50) {
                        widthDisplay.className = "absolute -top-6 left-0 text-[10px] text-white whitespace-nowrap";
                        heightDisplay.className = "absolute top-0 left-[calc(100%+8px)] text-[10px] text-white whitespace-nowrap";
                    } else {
                        widthDisplay.className = "text-xs text-white whitespace-nowrap";
                        heightDisplay.className = "text-xs text-white whitespace-nowrap";
                    }

                    widthDisplay.textContent = "Width: " + widthValue;
                    heightDisplay.textContent = "Height: " + heightValue;

                    widthSlider.value = w;
                    heightSlider.value = h;
                    textWidth.value = w;
                    textHeight.value = h;
                }

                applySize(widthSlider.value, heightSlider.value);

                widthSlider.addEventListener("input", () => applySize(widthSlider.value, heightSlider.value));
                heightSlider.addEventListener("input", () => applySize(widthSlider.value, heightSlider.value));

                updateButton.addEventListener("click", () => {
                    const w = parseInt(textWidth.value) || 10;
                    const h = parseInt(textHeight.value) || 10;
                    applySize(w, h);
                });
            });

            // Загрузка фона
            document.getElementById("background-upload").addEventListener("change", function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.body.style.backgroundImage = `url('${e.target.result}')`;
                        document.body.style.backgroundSize = "cover";
                        document.body.style.backgroundPosition = "center";
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Перемещение и изменение размера по всем краям и углам
            const draggableDiv = document.getElementById("div-size");
            let isDragging = false;
            let resizeDirection = null; 
            let startX = 0, startY = 0, startWidth = 0, startHeight = 0, startLeft = 0, startTop = 0;

            const BORDER_SIZE = 14; // Зона захвата по краям в пикселях

            function getDirection(clientX, clientY) {
                const rect = draggableDiv.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                let vertical = "";
                let horizontal = "";

                if (y < BORDER_SIZE) vertical = "top";
                else if (y > rect.height - BORDER_SIZE) vertical = "bottom";

                if (x < BORDER_SIZE) horizontal = "left";
                else if (x > rect.width - BORDER_SIZE) horizontal = "right";

                if (vertical && horizontal) return vertical + "-" + horizontal;
                if (vertical) return vertical;
                if (horizontal) return horizontal;
                return "";
            }

            // Динамическая принудительная смена курсора при наведении
            draggableDiv.addEventListener("mousemove", (e) => {
                if (isDragging || resizeDirection) return;
                const dir = getDirection(e.clientX, e.clientY);
                
                const cursors = {
                    "top": "ns-resize",
                    "bottom": "ns-resize",
                    "left": "ew-resize",
                    "right": "ew-resize",
                    "top-left": "nwse-resize",
                    "bottom-right": "nwse-resize",
                    "top-right": "nesw-resize",
                    "bottom-left": "nesw-resize"
                };

                draggableDiv.style.cursor = cursors[dir] || "grab";
            });

            function startAction(clientX, clientY) {
                const rect = draggableDiv.getBoundingClientRect();
                
                if (draggableDiv.style.position !== "absolute") {
                    draggableDiv.style.position = "absolute";
                    draggableDiv.style.left = rect.left + "px";
                    draggableDiv.style.top = rect.top + "px";
                }

                const dir = getDirection(clientX, clientY);

                if (dir) {
                    resizeDirection = dir;
                    startX = clientX;
                    startY = clientY;
                    startWidth = rect.width;
                    startHeight = rect.height;
                    startLeft = rect.left;
                    startTop = rect.top;
                } else {
                    isDragging = true;
                    startX = clientX - rect.left;
                    startY = clientY - rect.top;
                    draggableDiv.style.cursor = "grabbing";
                }
                draggableDiv.style.transition = "none";
            }

            function onAction(clientX, clientY) {
                if (isDragging) {
                    let newX = clientX - startX;
                    let newY = clientY - startY;

                    const maxX = window.innerWidth - draggableDiv.offsetWidth;
                    const maxY = window.innerHeight - draggableDiv.offsetHeight;

                    draggableDiv.style.left = Math.max(0, Math.min(newX, maxX)) + "px";
                    draggableDiv.style.top = Math.max(0, Math.min(newY, maxY)) + "px";
                } else if (resizeDirection) {
                    const dx = clientX - startX;
                    const dy = clientY - startY;

                    let newW = startWidth;
                    let newH = startHeight;
                    let newL = startLeft;
                    let newT = startTop;

                    if (resizeDirection.includes("right")) {
                        newW = Math.round(Math.max(10, Math.min(1000, startWidth + dx)));
                    }
                    if (resizeDirection.includes("left")) {
                        const potentialW = Math.round(startWidth - dx);
                        if (potentialW >= 10 && potentialW <= 1000) {
                            newW = potentialW;
                            newL = Math.round(startLeft + dx);
                        }
                    }
                    if (resizeDirection.includes("bottom")) {
                        newH = Math.round(Math.max(10, Math.min(1000, startHeight + dy)));
                    }
                    if (resizeDirection.includes("top")) {
                        const potentialH = Math.round(startHeight - dy);
                        if (potentialH >= 10 && potentialH <= 1000) {
                            newH = potentialH;
                            newT = Math.round(startTop + dy);
                        }
                    }

                    draggableDiv.style.width = newW + "px";
                    draggableDiv.style.height = newH + "px";
                    draggableDiv.style.left = newL + "px";
                    draggableDiv.style.top = newT + "px";

                    document.querySelector("#range-width").value = newW;
                    document.querySelector("#range-height").value = newH;
                    document.querySelector("#text-width").value = newW;
                    document.querySelector("#text-height").value = newH;

                    const widthDisplay = document.querySelector("#label-width");
                    const heightDisplay = document.querySelector("#label-height");

                    if (newW < 126 || newH < 50) {
                        widthDisplay.className = "absolute -top-6 left-0 text-[10px] text-white whitespace-nowrap";
                        heightDisplay.className = "absolute top-0 left-[calc(100%+8px)] text-[10px] text-white whitespace-nowrap";
                    } else {
                        widthDisplay.className = "text-xs text-white whitespace-nowrap";
                        heightDisplay.className = "text-xs text-white whitespace-nowrap";
                    }

                    widthDisplay.textContent = "Width: " + newW + "px";
                    heightDisplay.textContent = "Height: " + newH + "px";
                }
            }

            function stopAction() {
                if (isDragging || resizeDirection) {
                    isDragging = false;
                    resizeDirection = null;
                    draggableDiv.style.cursor = "grab";
                }
            }

            draggableDiv.addEventListener("mousedown", (e) => startAction(e.clientX, e.clientY));
            document.addEventListener("mousemove", (e) => onAction(e.clientX, e.clientY));
            document.addEventListener("mouseup", stopAction);

            draggableDiv.addEventListener("touchstart", (e) => {
                if (e.touches.length === 1) {
                    startAction(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            document.addEventListener("touchmove", (e) => {
                if ((isDragging || resizeDirection) && e.touches.length === 1) {
                    onAction(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            document.addEventListener("touchend", stopAction);
        </script>
    </body>
</html>
