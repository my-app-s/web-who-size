<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>What size</title>
        <link rel="stylesheet" href="output.css">
    </head>
    <body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col justify-between font-sans antialiased">
        <main class="mx-auto max-w-xl w-full p-6 flex flex-col gap-6 my-auto">
            <div class="flex flex-col gap-2">
                <h1 class="text-2xl font-bold tracking-tight">What size element for web</h1>
                <p class="text-neutral-400 text-sm">Please enter width and height (10 to 1000px):</p>
            </div>

            <div class="cursor-grab flex flex-col sm:flex-row gap-4 bg-neutral-900 border border-neutral-800 p-4 rounded-xl">
                <label class="flex-1 flex items-center justify-between text-sm font-medium">
                    <span>W:</span>
                    <input id="range-width" type="range" min="10" max="1000" value="500" class="w-3/4 accent-neutral-200 cursor-pointer">
                </label>
                <label class="flex-1 flex items-center justify-between text-sm font-medium">
                    <span>H:</span>
                    <input id="range-height" type="range" min="10" max="1000" value="100" class="w-3/4 accent-neutral-200 cursor-pointer">
                </label>
            </div>

            <div class="flex items-center gap-2">
                <input id="text-width" type="text" placeholder="Width" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-neutral-500">
                <span class="text-neutral-500 font-semibold">×</span>
                <input id="text-height" type="text" placeholder="Height" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-neutral-500">
                <button id="update-button" class="bg-neutral-100 text-neutral-900 font-medium px-5 py-2 rounded-lg text-sm hover:bg-neutral-200 transition-colors cursor-pointer">Select</button>
            </div>

            <div>
                <input type="file" id="background-upload" class="block w-full text-sm text-neutral-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-neutral-800 file:text-neutral-200 hover:file:bg-neutral-700 cursor-pointer">
            </div>

            <div id="div-size" class="div-for-size bg-neutral-900 border border-neutral-800 rounded-xl p-6 flex flex-col items-center justify-center gap-2 min-h-[150px]">
                <div class="div-for-size-width text-sm text-neutral-400">Width: 500px</div>
                <div class="div-for-size-height text-sm text-neutral-400">Height: 100px</div>
            </div>
        </main>

        <footer class="footer-info text-center text-xs text-neutral-500 py-6 border-t border-neutral-900 flex flex-col gap-1">
            <div>© Copyright 2025 my-app-s(M.R.E)</div>
            <div>
                <a href="https://github.com/my-app-s/web-who-size" class="text-neutral-400 hover:underline">web-who-size</a>
            </div>
            <div>Content rights and property belong to their respective authors.</div>
        </footer>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
            const div = document.querySelector(".div-for-size");
            const widthSlider = document.querySelector("#range-width");
            const heightSlider = document.querySelector("#range-height");
            const textWidth = document.querySelector("#text-width");
            const textHeight = document.querySelector("#text-height");
            const widthDisplay = document.querySelector(".div-for-size-width");
            const heightDisplay = document.querySelector(".div-for-size-height");
            const updateButton = document.querySelector("#update-button");

            function applySize(w, h) {
                const widthValue = w + "px";
                const heightValue = h + "px";

                div.style.width = widthValue;
                div.style.height = heightValue;

                widthDisplay.textContent = "Width: " + widthValue;
                heightDisplay.textContent = "Height: " + heightValue;

                // Синхронизируем инпуты и слайдеры между собой
                widthSlider.value = w;
                heightSlider.value = h;
                textWidth.value = w;
                textHeight.value = h;
            }

            // Инициализация при загрузке стартовыми значениями
            applySize(widthSlider.value, heightSlider.value);

            // События слайдеров (реальное время)
            widthSlider.addEventListener("input", () => applySize(widthSlider.value, heightSlider.value));
            heightSlider.addEventListener("input", () => applySize(widthSlider.value, heightSlider.value));

            // Обновление по кнопке из текстовых полей
            updateButton.addEventListener("click", () => {
                const w = parseInt(textWidth.value) || 100;
                const h = parseInt(textHeight.value) || 100;
                applySize(w, h);
            });
        });

        // Загрузка фона
        document.getElementById("background-upload").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = `url('${e.target.result}')`;
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                };
                reader.readAsDataURL(file);
            }
        });

        // Перемещение элемента мышей
        const draggableDiv = document.getElementById("div-size");

        let offsetX, offsetY, isDragging = false;

        draggableDiv.addEventListener("mousedown", (event) => {
            isDragging = true;
            offsetX = event.clientX - draggableDiv.getBoundingClientRect().left;
            offsetY = event.clientY - draggableDiv.getBoundingClientRect().top;
            draggableDiv.style.cursor = "grabbing";
            draggableDiv.style.transition = "none";
        });

        document.addEventListener("mousemove", (event) => {
            if (isDragging) {
                draggableDiv.style.position = "absolute";
                draggableDiv.style.left = (event.clientX - offsetX) + "px";
                draggableDiv.style.top = (event.clientY - offsetY) + "px";
            }
        });

        document.addEventListener("mouseup", () => {
            if (isDragging) {
                isDragging = false;
                draggableDiv.style.cursor = "grab";
                draggableDiv.style.transition = "top 0.2s ease, left 0.2s ease";
            }
        });
        </script>
    </body>
</html>
